$kind: http-request
description: Confirms the API is up before the suite runs. Restful-Booker answers GET /ping with 201 Created.
url: "{{base_url}}/ping"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("API is up - status 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response time < 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 1000
