$kind: http-request
description: Confirms the API is up before the suite runs. Restful-Booker answers GET /ping with 201 Created. It has no response-time check because it absorbs the demo server's cold start.
url: "{{base_url}}/ping"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      pm.test("API is up - status 201", function () {
          pm.response.to.have.status(201);
      });

      // No response-time check here: this request also absorbs the demo server's cold start.
    language: text/javascript
order: 1000
