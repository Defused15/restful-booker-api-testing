$kind: http-request
description: PATCH without a token cookie or Basic header must be rejected with 403.
url: "{{base_url}}/booking/{{booking_id}}"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
        "firstname": "Unauthorized"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403 - unauthorized", function () {
          pm.response.to.have.status(403);
      });

      pm.test("Response time < 800ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(800);
      });
    language: text/javascript
order: 5000
