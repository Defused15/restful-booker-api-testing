$kind: http-request
description: Removes the booking created by the totalprice-as-string edge case.
url: "{{base_url}}/booking/{{edge_booking_id_3}}"
method: DELETE
headers:
  Content-Type: application/json
  Cookie: token={{token}}
auth:
  type: basic
  credentials:
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Edge booking 3 deleted", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response time < 800ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(800);
      });
    language: text/javascript
order: 7000
