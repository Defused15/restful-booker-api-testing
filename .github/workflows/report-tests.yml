name: Report Tests

# Tests for the request report page and the QA Hub upload script. Runs only
# when that code (or its tooling) changes, separately from the API suite.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/report-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/report-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report-tests:
    name: Test Report Page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official Playwright image: Chromium and its system libraries are
    # preinstalled, so the job never waits on apt mirrors. Keep the tag in
    # sync with @playwright/test (the check below fails with a clear message).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.65.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Playwright version matches the image
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the container image is v$PLAYWRIGHT_IMAGE_VERSION. Update the image tag and PLAYWRIGHT_IMAGE_VERSION in this workflow."
            exit 1
          fi

      - name: Run report and upload-script tests
        run: npm run test:report

      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-page-tests
          path: test-results/
          retention-days: 14
