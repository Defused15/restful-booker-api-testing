name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs weekly on Mondays at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

# One run per ref at a time. Pull request runs are superseded by newer pushes;
# main runs queue so every report reaches the QA Hub in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling the workflow through the API resets that timer,
  # so the schedule keeps running without empty keepalive commits.
  keepalive:
    name: Keep scheduled workflow enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reset inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/api-tests.yml/enable"
          echo "Workflow re-enabled; inactivity timer reset."

  test:
    name: Run Newman API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.BASE_URL }}" ] || [ -z "${{ secrets.API_USERNAME }}" ] || [ -z "${{ secrets.API_PASSWORD }}" ]; then
            echo "ERROR: Required secrets are not configured (BASE_URL, API_USERNAME, API_PASSWORD)"
            exit 1
          fi

      - name: Create environment file
        run: |
          cat > restful-booker.postman_environment.json << 'EOF'
          {
            "id": "restful-booker-env",
            "name": "Restful-Booker",
            "values": [
              { "key": "base_url", "value": "${{ secrets.BASE_URL }}", "type": "default", "enabled": true },
              { "key": "username", "value": "${{ secrets.API_USERNAME }}", "type": "default", "enabled": true },
              { "key": "password", "value": "${{ secrets.API_PASSWORD }}", "type": "secret", "enabled": true },
              { "key": "token", "value": "", "type": "default", "enabled": true }
            ],
            "_postman_variable_scope": "environment"
          }
          EOF

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run API tests
        run: npm run test:ci

      # Request-level report (assertions, requests and responses, secrets masked).
      # Only reports/site/ is published to GitHub Pages, never the raw Newman JSON.
      - name: Build HTML report
        if: always() && hashFiles('reports/newman-report.json') != ''
        run: npm run report:build -- reports/newman-report.json reports/site

      # Only main publishes to the QA Hub: pull request runs (and forks without
      # secrets) must not overwrite the published report.
      - name: Push report to QA Hub
        id: hub_push
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          HUB_REPO: Defused15/test-hub
          PROJECT_NAME: Restful-Booker
          REPORT_PATH: ./reports/newman-report.json
        run: node scripts/publish-hub.mjs

      - name: Trigger Test Hub Rebuild
        if: always() && steps.hub_push.outcome == 'success'
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          HUB_REPO: Defused15/test-hub
          PROJECT_NAME: Restful-Booker
        run: |
          echo "🚀 Triggering build in $HUB_REPO..."
          GH_TOKEN=$HUB_TOKEN gh api repos/$HUB_REPO/dispatches \
            --method POST \
            -f event_type="test-hub-trigger" \
            -f client_payload[project]=$PROJECT_NAME

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-report
          path: reports/junit-report.xml
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Newman Test Results
          path: reports/junit-report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload HTML report as Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: reports/site/

  deploy:
    name: Deploy Report to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
